name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Unit & Two-Node RPC Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit & two-agent TCP RPC test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run CLI live migration demo (Commit + Rollback + Prometheus)
        run: |
          ./bin/lkmp demo --strategy auto --rss-mb 256 --dirty-mbps 40 --prometheus
          ./bin/lkmp demo --strategy pre-copy --inject-fault verify --prometheus
