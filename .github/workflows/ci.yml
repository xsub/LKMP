name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    name: Unit & Two-Node RPC Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit & two-agent TCP RPC test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run CLI live migration demo & SOTA benchmark (Commit + Rollback + Merkle Attestation + PKI)
        run: |
          ./bin/lkmp demo --strategy auto --rss-mb 256 --dirty-mbps 40 --prometheus
          ./bin/lkmp demo --strategy pre-copy --inject-fault verify --prometheus
          ./bin/lkmp demo --strategy cold --inject-fault corrupt-image
          ./bin/lkmp tls-init --out-dir /tmp/lkmp-ci-pki --host 127.0.0.1 --host ::1 --node node-a --node node-b --json
          ./bin/lkmp benchmark

  linux-criu-verification:
    name: Real Linux CRIU & Acceptance Verification (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies & CRIU 4.2+ (iproute2, nftables, rsync, CRIU)
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables rsync
          if ! sudo apt-get install -y criu || ! sudo criu check; then
            sudo bash scripts/install_criu_on_linux.sh
          fi

      - name: Inspect CRIU installation and kernel check
        run: |
          criu --version
          sudo criu check || true

      - name: Verify CRIU CLI flag compatibility (page-server, dump, lazy-pages)
        run: |
          criu page-server --help
          criu dump --help
          criu lazy-pages --help

      - name: Run full unit and acceptance test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run CLI live migration demo & benchmarks
        run: |
          ./bin/lkmp demo --strategy auto --rss-mb 256 --dirty-mbps 40 --prometheus
          ./bin/lkmp demo --strategy pre-copy --inject-fault verify --prometheus
          ./bin/lkmp demo --strategy cold --inject-fault corrupt-image
          ./bin/lkmp benchmark

      - name: Run acceptance verification suite
        run: |
          sudo ./bin/lkmp acceptance --backend REAL_CRIU
          sudo ./bin/lkmp acceptance --backend REAL_CRIU --json

      - name: Run real Linux CRIU E2E verification
        run: sudo python3 scripts/linux_criu_e2e.py
