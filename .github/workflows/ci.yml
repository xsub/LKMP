name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-package:
    name: Lint, Bytecode & Wheel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Ruff static analysis & Python bytecode check
        run: |
          python3 -m pip install --upgrade pip ruff build
          ruff check lkmp/ tests/ scripts/
          python3 -m compileall -q lkmp tests scripts

      - name: Build sdist + wheel & smoke-test installed CLI
        run: |
          python3 -m build
          python3 -m venv /tmp/lkmp-wheel-venv
          /tmp/lkmp-wheel-venv/bin/pip install dist/*.whl
          /tmp/lkmp-wheel-venv/bin/lkmp --help >/dev/null
          /tmp/lkmp-wheel-venv/bin/lkmp demo --strategy cold --rss-mb 16 >/dev/null

  unit-matrix:
    name: Unit & 2PC RPC Matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: "macos-latest"
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 133-test unit, driver & two-agent mTLS RPC suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run CLI live migration demo, fault injection, PKI & SOTA benchmark
        run: |
          ./bin/lkmp demo --strategy auto --rss-mb 256 --dirty-mbps 40 --prometheus
          ./bin/lkmp demo --strategy pre-copy --inject-fault verify --prometheus
          ./bin/lkmp demo --strategy cold --inject-fault corrupt-image
          ./bin/lkmp tls-init --out-dir /tmp/lkmp-ci-pki --host 127.0.0.1 --host ::1 --node node-a --node node-b --json
          ./bin/lkmp benchmark
