name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    name: Build Signed Artifacts & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint, test & build Python distribution packages
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip ruff build
          ruff check lkmp/ tests/ scripts/
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m build
          mkdir -p /tmp/lkmp-release-sdist-check
          tar -xzf dist/lkmp-*.tar.gz -C /tmp/lkmp-release-sdist-check
          (
            cd /tmp/lkmp-release-sdist-check/lkmp-*
            python3 -m unittest discover -s tests -p "test_*.py"
          )
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lkmp-dist
          path: dist/*

      - name: Create GitHub Release (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "LKMP ${GITHUB_REF_NAME}" \
            --generate-notes
