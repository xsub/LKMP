<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrAmber2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3b341"/>
    </marker>
    <marker id="arrBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="14" fill="url(#bgGrad2)" stroke="#30363d" stroke-width="2"/>

  <!-- Main Header -->
  <text x="600" y="34" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">LKMP 10-STATE LIVE MIGRATION PIPELINE &amp; TRANSACTIONAL ROLLBACK</text>


  <!-- ==================== QUADRANT 1 (TOP-LEFT): ONLINE PHASE (x=28..582, width=554) ==================== -->
  <rect x="28" y="54" width="554" height="208" rx="10" fill="#121d17" stroke="#238636" stroke-width="1.5"/>
  <rect x="28" y="54" width="554" height="28" rx="10" fill="#238636"/>
  <text x="305" y="73" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.4">PHASE I — ONLINE PREFLIGHT &amp; PRE-COPY (0 ms DOWNTIME)</text>

  <!-- Step 1: PREFLIGHT (x=44..202, width=158) -->
  <rect x="44" y="98" width="158" height="82" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="123" y="119" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">1. PREFLIGHT</text>
  <text x="123" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">CPU ISA Superset</text>
  <text x="123" y="154" fill="#8b949e" font-size="10" text-anchor="middle">ELF build-id &amp; SHA256</text>
  <text x="123" y="170" fill="#8b949e" font-size="10" text-anchor="middle">Scan /proc Blockers</text>

  <path d="M 202 139 L 222 139" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Step 2: PREPARE (x=226..384, width=158) -->
  <rect x="226" y="98" width="158" height="82" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="305" y="119" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">2. PREPARE</text>
  <text x="305" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">Pre-sync Writable FS</text>
  <text x="305" y="154" fill="#8b949e" font-size="10" text-anchor="middle">Create Image Dirs</text>
  <text x="305" y="170" fill="#8b949e" font-size="10" text-anchor="middle">Start TLS Page-Server</text>

  <path d="M 384 139 L 404 139" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Step 3: PRE_COPY (x=408..566, width=158) -->
  <rect x="408" y="98" width="158" height="82" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="487" y="119" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">3. PRE_COPY (1..N)</text>
  <text x="487" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">Iterative pre-dump</text>
  <text x="487" y="154" fill="#8b949e" font-size="10" text-anchor="middle">MEM_SOFT_DIRTY</text>
  <text x="487" y="170" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">App Keeps Running</text>

  <!-- Footer Note inside Quadrant 1 (x=44..566, width=522) -->
  <rect x="44" y="192" width="522" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="305" y="212" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">Pre-Copy Convergence Stopping Rules:</text>
  <text x="305" y="232" fill="#8b949e" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">dirty &lt;= bw * target_downtime  |  shrink &lt; 10%  |  round &gt;= 8</text>


  <!-- Connector from Quadrant 1 to Quadrant 2 -->
  <path d="M 582 139 L 614 139" stroke="#e3b341" stroke-width="2.5" marker-end="url(#arrAmber2)"/>


  <!-- ==================== QUADRANT 2 (TOP-RIGHT): FREEZE & RESTORE (x=618..1172, width=554) ==================== -->
  <rect x="618" y="54" width="554" height="208" rx="10" fill="#241c11" stroke="#d29922" stroke-width="1.5"/>
  <rect x="618" y="54" width="554" height="28" rx="10" fill="#d29922"/>
  <text x="895" y="73" fill="#0d1117" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.4">PHASE II — FREEZE, FINAL DUMP &amp; RESTORE (&lt; 200 ms WINDOW)</text>

  <!-- Step 4: FREEZE & DUMP (x=634..792, width=158) -->
  <rect x="634" y="98" width="158" height="82" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="713" y="119" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">4. FINAL_DUMP</text>
  <text x="713" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">nftables DROP Lock</text>
  <text x="713" y="154" fill="#8b949e" font-size="10" text-anchor="middle">cgroup.freeze = 1</text>
  <text x="713" y="170" fill="#8b949e" font-size="10" text-anchor="middle">dump --leave-stopped</text>

  <path d="M 792 139 L 812 139" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Step 5: TRANSFER (x=816..974, width=158) -->
  <rect x="816" y="98" width="158" height="82" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="895" y="119" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">5. TRANSFER</text>
  <text x="895" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">Final Dirty Pages</text>
  <text x="895" y="154" fill="#8b949e" font-size="10" text-anchor="middle">Metadata core/fd .img</text>
  <text x="895" y="170" fill="#8b949e" font-size="10" text-anchor="middle">rsync Final FS Delta</text>

  <path d="M 974 139 L 994 139" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Step 6: RESTORE (x=998..1156, width=158) -->
  <rect x="998" y="98" width="158" height="82" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="1077" y="119" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">6. RESTORE (B)</text>
  <text x="1077" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">criu restore on B</text>
  <text x="1077" y="154" fill="#8b949e" font-size="10" text-anchor="middle">--tcp-established</text>
  <text x="1077" y="170" fill="#8b949e" font-size="10" text-anchor="middle">GPU Context Restore</text>

  <!-- Footer Note inside Quadrant 2 (x=634..1156, width=522) -->
  <rect x="634" y="192" width="522" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="895" y="212" fill="#e3b341" font-size="11" font-weight="600" text-anchor="middle">Zero-RST TCP Protection &amp; Non-Destructive Freeze:</text>
  <text x="895" y="232" fill="#8b949e" font-size="10.5" text-anchor="middle">Source A stays frozen (--leave-stopped); nftables blocks TCP RST.</text>


  <!-- ==================== QUADRANT 3 (BOTTOM-LEFT): SWITCHOVER, VERIFY & COMMIT (x=28..582, width=554) ==================== -->
  <rect x="28" y="288" width="554" height="208" rx="10" fill="#121d24" stroke="#388bfd" stroke-width="1.5"/>
  <rect x="28" y="288" width="554" height="28" rx="10" fill="#1f6feb"/>
  <text x="305" y="307" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.4">PHASE III — SWITCHOVER, HEALTH VERIFY &amp; COMMIT (HAPPY PATH)</text>

  <!-- Step 7: SWITCHOVER (x=44..202, width=158) -->
  <rect x="44" y="332" width="158" height="82" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="123" y="353" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">7. SWITCHOVER</text>
  <text x="123" y="372" fill="#e6edf3" font-size="11" text-anchor="middle">Move IP to Host B</text>
  <text x="123" y="388" fill="#8b949e" font-size="10" text-anchor="middle">GARP / BGP /32 Route</text>
  <text x="123" y="404" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">SIGCONT on Host B</text>

  <path d="M 202 373 L 222 373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Step 8: VERIFY (x=226..384, width=158) -->
  <rect x="226" y="332" width="158" height="82" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="305" y="353" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">8. VERIFY HEALTH</text>
  <text x="305" y="372" fill="#e6edf3" font-size="11" text-anchor="middle">Check PID Alive on B</text>
  <text x="305" y="388" fill="#8b949e" font-size="10" text-anchor="middle">Run --health-cmd</text>
  <text x="305" y="404" fill="#8b949e" font-size="10" text-anchor="middle">Confirm TCP Progress</text>

  <path d="M 384 373 L 404 373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Step 9: COMMIT (x=408..566, width=158) -->
  <rect x="408" y="332" width="158" height="82" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="487" y="353" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">9. COMMIT</text>
  <text x="487" y="372" fill="#e6edf3" font-size="11" text-anchor="middle">SIGKILL Source A</text>
  <text x="487" y="388" fill="#8b949e" font-size="10" text-anchor="middle">Unlock nftables on A</text>
  <text x="487" y="404" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">Zero-Wipe *.img Files</text>

  <!-- Footer Note inside Quadrant 3 (x=44..566, width=522) -->
  <rect x="44" y="426" width="522" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="305" y="446" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">Downtime Ends at Step 7 • Secrets Wiped at Step 9:</text>
  <text x="305" y="466" fill="#8b949e" font-size="10.5" text-anchor="middle">Memory dumps (pages-*.img, core-*.img) are zero-wiped on commit.</text>


  <!-- ==================== QUADRANT 4 (BOTTOM-RIGHT): TRANSACTIONAL ROLLBACK (x=618..1172, width=554) ==================== -->
  <rect x="618" y="288" width="554" height="208" rx="10" fill="#251316" stroke="#f85149" stroke-width="1.5"/>
  <rect x="618" y="288" width="554" height="28" rx="10" fill="#da3633"/>
  <text x="895" y="307" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.4">10. TRANSACTIONAL ROLLBACK (IF RESTORE OR VERIFY FAILS)</text>

  <!-- Rollback Step R1 (x=634..792, width=158) -->
  <rect x="634" y="332" width="158" height="82" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="713" y="353" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">R1. CLEANUP DEST B</text>
  <text x="713" y="372" fill="#e6edf3" font-size="11" text-anchor="middle">SIGKILL Partial B</text>
  <text x="713" y="388" fill="#8b949e" font-size="10" text-anchor="middle">Release IP on Host B</text>
  <text x="713" y="404" fill="#8b949e" font-size="10" text-anchor="middle">Wipe B Image Dirs</text>

  <path d="M 792 373 L 812 373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Rollback Step R2 (x=816..974, width=158) -->
  <rect x="816" y="332" width="158" height="82" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="895" y="353" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">R2. RECLAIM NET A</text>
  <text x="895" y="372" fill="#e6edf3" font-size="11" text-anchor="middle">Re-Claim IP on A</text>
  <text x="895" y="388" fill="#8b949e" font-size="10" text-anchor="middle">GARP / BGP Back to A</text>
  <text x="895" y="404" fill="#8b949e" font-size="10" text-anchor="middle">Unlock nftables on A</text>

  <path d="M 974 373 L 994 373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Rollback Step R3 (x=998..1156, width=158) -->
  <rect x="998" y="332" width="158" height="82" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="1077" y="353" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">R3. RESUME HOST A</text>
  <text x="1077" y="372" fill="#e6edf3" font-size="11" text-anchor="middle">cgroup.freeze = 0</text>
  <text x="1077" y="388" fill="#8b949e" font-size="10" text-anchor="middle">Send SIGCONT to A</text>
  <text x="1077" y="404" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">Zero Data Loss!</text>

  <!-- Footer Note inside Quadrant 4 (x=634..1156, width=522) -->
  <rect x="634" y="426" width="522" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="895" y="446" fill="#ff7b72" font-size="11" font-weight="600" text-anchor="middle">Guaranteed Safe Recovery on Any Failure:</text>
  <text x="895" y="466" fill="#8b949e" font-size="10.5" text-anchor="middle">Source A is never killed until Step 8 succeeds; rollback thaws Host A.</text>

  <!-- Inter-Row Connectors (Step 6 -> Step 7 and Failure -> Rollback) -->
  <path d="M 750 262 L 450 286" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrBlue2)"/>
  <text x="580" y="278" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">Restore OK → Switchover</text>

  <path d="M 980 262 L 980 284" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrRed2)"/>
  <text x="1045" y="278" fill="#ff7b72" font-size="10" font-weight="600" text-anchor="middle">Error → Rollback</text>

  <path d="M 582 373 L 614 373" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrRed2)"/>
</svg>
