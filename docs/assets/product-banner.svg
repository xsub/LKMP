<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1320"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="22%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#111927" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="gridDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="310" rx="18" fill="url(#bannerBg)" stroke="#30363d" stroke-width="2"/>
  <rect width="1200" height="310" rx="18" fill="url(#gridDots)"/>
  <rect width="1200" height="310" rx="18" fill="url(#glowCyan)"/>
  <rect width="1200" height="310" rx="18" fill="url(#glowEmerald)"/>

  <!-- Top Accent Line -->
  <rect x="60" y="1" width="1080" height="2.5" rx="1.25" fill="url(#logoGrad)"/>

  <!-- Left Geometric Emblem: Atomic Dual-Node Live Switchover -->
  <g transform="translate(68, 52)">
    <rect x="0" y="0" width="108" height="108" rx="24" fill="#131a27" stroke="url(#pillBorder)" stroke-width="2"/>
    <!-- Source Node Ring -->
    <circle cx="34" cy="54" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="34" cy="54" r="6" fill="#58a6ff"/>
    <!-- Destination Node Ring -->
    <circle cx="74" cy="54" r="16" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
    <circle cx="74" cy="54" r="6" fill="#3fb950"/>
    <!-- Zero-Copy Arcs -->
    <path d="M 38 35 C 48 20, 60 20, 70 35" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="72,37 65,33 70,28" fill="#58a6ff"/>
    <path d="M 70 73 C 60 88, 48 88, 38 73" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
    <!-- Version Pill under Emblem -->
    <rect x="14" y="118" width="80" height="22" rx="11" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
    <text x="54" y="133" fill="#58a6ff" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">v0.3.0</text>
  </g>

  <!-- Product Title & Subtitle -->
  <text x="204" y="96" fill="#f0f6fc" font-size="44" font-weight="800" letter-spacing="-0.8">LKMP</text>
  <rect x="342" y="67" width="244" height="28" rx="14" fill="#122d1f" stroke="#2ea043" stroke-width="1.2"/>
  <circle cx="358" cy="81" r="4.5" fill="#3fb950"/>
  <text x="470" y="85" fill="#3fb950" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.4">ZERO-SPLIT-BRAIN 2PC ENGINE</text>

  <text x="204" y="132" fill="#c9d1d9" font-size="18.5" font-weight="600">
    Real-Time, Near-Zero-Copy Live Migration Orchestrator for Linux
  </text>
  <text x="204" y="160" fill="#8b949e" font-size="14">
    Move running POSIX process trees, QEMU/KVM VMs, OCI containers &amp; MicroVMs across hosts with millisecond blackout,
  </text>
  <text x="204" y="181" fill="#8b949e" font-size="14">
    preserved TCP connections, cryptographic Merkle attestation, and fsynced Write-Ahead Log crash recovery.
  </text>

  <!-- 4 Telemetry / Product Stat Cards (y=212, height=72) -->
  <!-- Card 1 -->
  <rect x="68" y="214" width="252" height="70" rx="12" fill="#131a26" stroke="#30363d" stroke-width="1.5"/>
  <text x="88" y="242" fill="#58a6ff" font-size="22" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~18.6 ms</text>
  <text x="88" y="262" fill="#e6edf3" font-size="12" font-weight="600">Measured 2PC Blackout</text>
  <text x="88" y="276" fill="#8b949e" font-size="10.5">Live QEMU 8.2 QMP + memfd cutover</text>

  <!-- Card 2 -->
  <rect x="338" y="214" width="252" height="70" rx="12" fill="#131a26" stroke="#30363d" stroke-width="1.5"/>
  <text x="358" y="242" fill="#3fb950" font-size="22" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4 Runtimes</text>
  <text x="358" y="262" fill="#e6edf3" font-size="12" font-weight="600">CRIU · QEMU · OCI · MicroVM</text>
  <text x="358" y="276" fill="#8b949e" font-size="10.5">Auto-routed via lkmp doctor</text>

  <!-- Card 3 -->
  <rect x="608" y="214" width="252" height="70" rx="12" fill="#131a26" stroke="#30363d" stroke-width="1.5"/>
  <text x="628" y="242" fill="#e3b341" font-size="22" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Zero-Copy</text>
  <text x="628" y="262" fill="#e6edf3" font-size="12" font-weight="600">MSG_ZEROCOPY &amp; FICLONE</text>
  <text x="628" y="276" fill="#8b949e" font-size="10.5">/dev/shm staging + raw AF_PACKET GARP</text>

  <!-- Card 4 -->
  <rect x="878" y="214" width="254" height="70" rx="12" fill="#131a26" stroke="#30363d" stroke-width="1.5"/>
  <text x="898" y="242" fill="#a371f7" font-size="22" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 Runtime Deps</text>
  <text x="898" y="262" fill="#e6edf3" font-size="12" font-weight="600">Pure Python 3.10+ Stdlib</text>
  <text x="898" y="276" fill="#8b949e" font-size="10.5">PEP 561 typed SDK + 14-cmd CLI</text>
</svg>
