<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="hostAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="criuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#13181f"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="660" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Top Control Plane Box -->
  <rect x="330" y="22" width="440" height="68" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <rect x="330" y="22" width="440" height="24" rx="10" fill="url(#ctrlGrad)"/>
  <text x="550" y="39" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">CONTROL PLANE — LKMP ORCHESTRATOR &amp; CLI</text>
  <text x="550" y="64" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">10-State FSM • Preflight Analyzer • Convergence Tracker • Rollback Engine</text>
  <text x="550" y="81" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">lkmp preflight | lkmp migrate --strategy pre-copy|lazy|hybrid|cold</text>

  <!-- mTLS RPC Connectors from Control Plane to Host A and Host B -->
  <path d="M 390 90 L 230 148" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <rect x="235" y="102" width="128" height="20" rx="4" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  <text x="299" y="116" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">JSON-RPC over mTLS</text>

  <path d="M 710 90 L 870 148" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <rect x="737" y="102" width="128" height="20" rx="4" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  <text x="801" y="116" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">JSON-RPC over mTLS</text>

  <!-- ==================== SOURCE HOST A ==================== -->
  <rect x="28" y="150" width="415" height="400" rx="12" fill="url(#hostAGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="28" y="150" width="415" height="32" rx="12" fill="#21262d"/>
  <circle cx="48" cy="166" r="5" fill="#3fb950"/>
  <text x="62" y="171" fill="#e6edf3" font-size="13" font-weight="700">SOURCE HOST A</text>
  <text x="428" y="171" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">10.0.0.1:9700</text>

  <!-- Agent A -->
  <rect x="46" y="196" width="379" height="44" rx="8" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
  <text x="62" y="216" fill="#58a6ff" font-size="12" font-weight="700">lkmp-agent (Source Daemon)</text>
  <text x="62" y="232" fill="#8b949e" font-size="11">Inspects /proc/&lt;pid&gt; • ELF build-id • CPU ISA • Controls CRIU &amp; nftables</text>

  <!-- Migration Envelope A -->
  <rect x="46" y="252" width="379" height="128" rx="8" fill="url(#envGrad)" stroke="#d29922" stroke-width="1.5"/>
  <text x="62" y="272" fill="#e3b341" font-size="12" font-weight="700">Migration Envelope (lkmp run)</text>
  <text x="412" y="272" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">cgroup.freeze</text>
  <text x="62" y="289" fill="#8b949e" font-size="11">Isolated Namespaces: PID • Net • Mount • IPC • UTS • Time (CLOCK_MONOTONIC)</text>

  <!-- Workload Process Box inside Envelope A -->
  <rect x="60" y="299" width="215" height="68" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="72" y="317" fill="#e6edf3" font-size="12" font-weight="600">Running Process Tree</text>
  <text x="72" y="334" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PID 1 (host: 4242) + child threads</text>
  <text x="72" y="350" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Open FDs • Established TCP Sockets</text>

  <!-- Memory Pages Box inside Envelope A -->
  <rect x="285" y="299" width="126" height="68" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="348" y="316" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">RAM Pages</text>
  <rect x="295" y="324" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="323" y="324" width="24" height="14" rx="2" fill="#da3633"/>
  <rect x="351" y="324" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="379" y="324" width="22" height="14" rx="2" fill="#da3633"/>
  <text x="348" y="354" fill="#8b949e" font-size="10" text-anchor="middle">MEM_SOFT_DIRTY</text>

  <!-- CRIU Engine A -->
  <rect x="46" y="392" width="250" height="72" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="1.5"/>
  <rect x="46" y="392" width="250" height="22" rx="8" fill="url(#criuGrad)"/>
  <text x="171" y="407" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CRIU CHECKPOINT ENGINE</text>
  <text x="58" y="431" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu pre-dump --track-mem</text>
  <text x="58" y="449" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu dump --leave-stopped</text>

  <!-- GPU / Plugin Box A -->
  <rect x="306" y="392" width="119" height="72" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="365" y="413" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">GPU Plugins</text>
  <text x="365" y="431" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">cuda-checkpoint</text>
  <text x="365" y="447" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">amdgpu_plugin</text>

  <!-- Network Lock & Storage A -->
  <rect x="46" y="476" width="379" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="497" fill="#f85149" font-size="11" font-weight="700">nftables Lock (Suppresses TCP RST)</text>
  <text x="60" y="516" fill="#8b949e" font-size="11">Drops packets during freeze • Zero-wipes pages-*.img on Commit</text>


  <!-- ==================== DESTINATION HOST B ==================== -->
  <rect x="657" y="150" width="415" height="400" rx="12" fill="url(#hostAGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="657" y="150" width="415" height="32" rx="12" fill="#21262d"/>
  <circle cx="677" cy="166" r="5" fill="#58a6ff"/>
  <text x="691" y="171" fill="#e6edf3" font-size="13" font-weight="700">DESTINATION HOST B</text>
  <text x="1057" y="171" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">10.0.0.2:9700</text>

  <!-- Agent B -->
  <rect x="675" y="196" width="379" height="44" rx="8" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
  <text x="691" y="216" fill="#58a6ff" font-size="12" font-weight="700">lkmp-agent (Destination Daemon)</text>
  <text x="691" y="232" fill="#8b949e" font-size="11">Verifies CPU superset &amp; ELF hashes • Runs page-server, restore &amp; health check</text>

  <!-- Restored Envelope B -->
  <rect x="675" y="252" width="379" height="128" rx="8" fill="url(#envGrad)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="691" y="272" fill="#3fb950" font-size="12" font-weight="700">Restored Migration Envelope</text>
  <text x="1041" y="272" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">SIGCONT on Switchover</text>
  <text x="691" y="289" fill="#8b949e" font-size="11">Identical PID tree, Virtual Memory, File Descriptors &amp; TCP Sequence State</text>

  <!-- Restored Process Box inside Envelope B -->
  <rect x="689" y="299" width="215" height="68" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="701" y="317" fill="#e6edf3" font-size="12" font-weight="600">Resumed Process Tree</text>
  <text x="701" y="334" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Same internal PIDs &amp; sockets</text>
  <text x="701" y="350" fill="#3fb950" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Health Check (--health-cmd) OK</text>

  <!-- Restored Memory Box inside Envelope B -->
  <rect x="914" y="299" width="126" height="68" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="977" y="316" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">Restored RAM</text>
  <rect x="924" y="324" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="952" y="324" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="980" y="324" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="1008" y="324" width="22" height="14" rx="2" fill="#1f6feb"/>
  <text x="977" y="354" fill="#8b949e" font-size="10" text-anchor="middle">Pre-copy / uffd</text>

  <!-- CRIU Engine B -->
  <rect x="675" y="392" width="250" height="72" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="1.5"/>
  <rect x="675" y="392" width="250" height="22" rx="8" fill="url(#criuGrad)"/>
  <text x="800" y="407" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CRIU RESTORE &amp; PAGE SERVER</text>
  <text x="687" y="431" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu page-server --tls</text>
  <text x="687" y="449" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu restore / lazy-pages</text>

  <!-- GPU / Plugin Box B -->
  <rect x="935" y="392" width="119" height="72" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="994" y="413" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">GPU Restore</text>
  <text x="994" y="431" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">--action restore</text>
  <text x="994" y="447" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">--action unlock</text>

  <!-- Verification & Rollback Guard B -->
  <rect x="675" y="476" width="379" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="689" y="497" fill="#3fb950" font-size="11" font-weight="700">Transactional Switchover &amp; Verification</text>
  <text x="689" y="516" fill="#8b949e" font-size="11">Claims IP • Unlocks nftables • Triggers Rollback on A if Verify fails</text>


  <!-- ==================== INTER-HOST DATA CHANNELS (CENTER) ==================== -->
  <!-- 1. Memory Stream (CRIU Page-Server / Lazy-Pages) -->
  <path d="M 443 420 L 655 420" fill="none" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="462" y="384" width="176" height="44" rx="6" fill="#0d1117" stroke="#2ea043" stroke-width="1.5"/>
  <text x="550" y="402" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">1. RAM Pages Stream (TLS)</text>
  <text x="550" y="419" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">TCP :27000 / :27001 (uffd)</text>

  <!-- 2. Metadata & FS Delta Stream -->
  <path d="M 443 320 L 655 320" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <rect x="462" y="284" width="176" height="44" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="550" y="302" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">2. Metadata &amp; FS Sync</text>
  <text x="550" y="319" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Shared NFS/Ceph or rsync</text>


  <!-- ==================== BOTTOM NETWORK / IP MOBILITY FABRIC ==================== -->
  <rect x="180" y="576" width="740" height="62" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <rect x="180" y="576" width="740" height="22" rx="10" fill="url(#netGrad)"/>
  <text x="550" y="591" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">NETWORK &amp; IP MOBILITY LAYER (PRESERVES ESTABLISHED TCP CONNECTIONS)</text>
  <text x="550" y="616" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Workload IP (e.g. 10.0.0.99/24) moves seamlessly from Source A to Destination B</text>
  <text x="550" y="632" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">L2: Gratuitous ARP (arping -U) / IPv6 NA   •   L3: BGP /32 Route (gobgp)   •   Cloud: VPC Secondary IP Webhook</text>

  <!-- Connectors to Network Layer -->
  <path d="M 235 550 L 285 576" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="205" y="568" fill="#a371f7" font-size="10" font-weight="600">1. Release IP</text>

  <path d="M 865 550 L 815 576" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="895" y="568" fill="#a371f7" font-size="10" font-weight="600" text-anchor="end">2. Claim IP + GARP/BGP</text>
</svg>
