<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="criuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#13181f"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Top Control Plane Box (x=310..890, width=580) -->
  <rect x="310" y="22" width="580" height="72" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <rect x="310" y="22" width="580" height="26" rx="10" fill="url(#ctrlGrad)"/>
  <text x="600" y="40" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.6">CONTROL PLANE — LKMP ORCHESTRATOR &amp; CLI</text>
  <text x="600" y="66" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">10-State FSM • Preflight • Convergence Tracker • Rollback</text>
  <text x="600" y="84" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">lkmp preflight | lkmp migrate --strategy pre-copy|lazy</text>

  <!-- mTLS RPC Connectors -->
  <path d="M 410 94 L 250 150" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <rect x="250" y="106" width="140" height="22" rx="5" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  <text x="320" y="121" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">JSON-RPC over mTLS</text>

  <path d="M 790 94 L 950 150" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <rect x="810" y="106" width="140" height="22" rx="5" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  <text x="880" y="121" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">JSON-RPC over mTLS</text>


  <!-- ==================== SOURCE HOST A (x=28..478, width=450) ==================== -->
  <rect x="28" y="152" width="450" height="412" rx="12" fill="url(#hostGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="28" y="152" width="450" height="34" rx="12" fill="#21262d"/>
  <circle cx="48" cy="169" r="5" fill="#3fb950"/>
  <text x="62" y="174" fill="#e6edf3" font-size="13" font-weight="700">SOURCE HOST A</text>
  <text x="460" y="174" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">10.0.0.1:9700</text>

  <!-- Agent A (x=46..460, width=414) -->
  <rect x="46" y="198" width="414" height="46" rx="8" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
  <text x="62" y="218" fill="#58a6ff" font-size="12" font-weight="700">lkmp-agent (Source Daemon)</text>
  <text x="62" y="235" fill="#8b949e" font-size="11">Scans /proc/&lt;pid&gt; • ELF build-id • CPU ISA • CRIU</text>

  <!-- Migration Envelope A (x=46..460, width=414) -->
  <rect x="46" y="256" width="414" height="132" rx="8" fill="url(#envGrad)" stroke="#d29922" stroke-width="1.5"/>
  <text x="62" y="276" fill="#e3b341" font-size="12" font-weight="700">Migration Envelope (lkmp run)</text>
  <text x="444" y="276" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">cgroup.freeze</text>
  <text x="62" y="294" fill="#8b949e" font-size="11">Namespaces: PID • Net • Mount • IPC • UTS • Time</text>

  <!-- Workload Process Box inside Envelope A (x=60..298, width=238) -->
  <rect x="60" y="304" width="238" height="70" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="74" y="323" fill="#e6edf3" font-size="12" font-weight="600">Running Process Tree</text>
  <text x="74" y="341" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PID 1 (host: 4242) + children</text>
  <text x="74" y="358" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Open FDs &amp; Active TCP Sockets</text>

  <!-- Memory Pages Box inside Envelope A (x=310..446, width=136) -->
  <rect x="310" y="304" width="136" height="70" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="378" y="322" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">RAM Pages</text>
  <rect x="322" y="330" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="351" y="330" width="24" height="14" rx="2" fill="#da3633"/>
  <rect x="380" y="330" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="409" y="330" width="24" height="14" rx="2" fill="#da3633"/>
  <text x="378" y="361" fill="#8b949e" font-size="10" text-anchor="middle">MEM_SOFT_DIRTY</text>

  <!-- CRIU Engine A (x=46..312, width=266) -->
  <rect x="46" y="400" width="266" height="74" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="1.5"/>
  <rect x="46" y="400" width="266" height="24" rx="8" fill="url(#criuGrad)"/>
  <text x="179" y="416" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CRIU CHECKPOINT ENGINE</text>
  <text x="60" y="441" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu pre-dump --track-mem</text>
  <text x="60" y="459" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu dump --leave-stopped</text>

  <!-- GPU / Plugin Box A (x=324..460, width=136) -->
  <rect x="324" y="400" width="136" height="74" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="392" y="422" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">GPU Plugins</text>
  <text x="392" y="441" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">cuda-checkpoint</text>
  <text x="392" y="458" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">amdgpu_plugin</text>

  <!-- Network Lock & Storage A (x=46..460, width=414) -->
  <rect x="46" y="486" width="414" height="62" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="62" y="508" fill="#f85149" font-size="11" font-weight="700">nftables Lock &amp; Secret Wipe</text>
  <text x="62" y="528" fill="#8b949e" font-size="11">Drops packets during freeze • Zero-wipes *.img</text>


  <!-- ==================== DESTINATION HOST B (x=722..1172, width=450) ==================== -->
  <rect x="722" y="152" width="450" height="412" rx="12" fill="url(#hostGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="722" y="152" width="450" height="34" rx="12" fill="#21262d"/>
  <circle cx="742" cy="169" r="5" fill="#58a6ff"/>
  <text x="756" y="174" fill="#e6edf3" font-size="13" font-weight="700">DESTINATION HOST B</text>
  <text x="1154" y="174" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">10.0.0.2:9700</text>

  <!-- Agent B (x=740..1154, width=414) -->
  <rect x="740" y="198" width="414" height="46" rx="8" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
  <text x="756" y="218" fill="#58a6ff" font-size="12" font-weight="700">lkmp-agent (Destination Daemon)</text>
  <text x="756" y="235" fill="#8b949e" font-size="11">Checks CPU superset &amp; ELF • Runs restore &amp; health</text>

  <!-- Restored Envelope B (x=740..1154, width=414) -->
  <rect x="740" y="256" width="414" height="132" rx="8" fill="url(#envGrad)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="756" y="276" fill="#3fb950" font-size="12" font-weight="700">Restored Migration Envelope</text>
  <text x="1138" y="276" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">SIGCONT on Switchover</text>
  <text x="756" y="294" fill="#8b949e" font-size="11">Preserves PID tree, Memory, Open FDs &amp; TCP state</text>

  <!-- Restored Process Box inside Envelope B (x=754..992, width=238) -->
  <rect x="754" y="304" width="238" height="70" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="768" y="323" fill="#e6edf3" font-size="12" font-weight="600">Resumed Process Tree</text>
  <text x="768" y="341" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Same internal PIDs &amp; sockets</text>
  <text x="768" y="358" fill="#3fb950" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Health Check (--health-cmd) OK</text>

  <!-- Restored Memory Box inside Envelope B (x=1004..1140, width=136) -->
  <rect x="1004" y="304" width="136" height="70" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="1072" y="322" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">Restored RAM</text>
  <rect x="1016" y="330" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="1045" y="330" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="1074" y="330" width="24" height="14" rx="2" fill="#238636"/>
  <rect x="1103" y="330" width="24" height="14" rx="2" fill="#1f6feb"/>
  <text x="1072" y="361" fill="#8b949e" font-size="10" text-anchor="middle">Pre-copy / uffd</text>

  <!-- CRIU Engine B (x=740..1006, width=266) -->
  <rect x="740" y="400" width="266" height="74" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="1.5"/>
  <rect x="740" y="400" width="266" height="24" rx="8" fill="url(#criuGrad)"/>
  <text x="873" y="416" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CRIU RESTORE &amp; PAGE SERVER</text>
  <text x="754" y="441" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu page-server --tls</text>
  <text x="754" y="459" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">• criu restore / lazy-pages</text>

  <!-- GPU / Plugin Box B (x=1018..1154, width=136) -->
  <rect x="1018" y="400" width="136" height="74" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="1086" y="422" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">GPU Restore</text>
  <text x="1086" y="441" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">--action restore</text>
  <text x="1086" y="458" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">--action unlock</text>

  <!-- Verification & Rollback Guard B (x=740..1154, width=414) -->
  <rect x="740" y="486" width="414" height="62" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="756" y="508" fill="#3fb950" font-size="11" font-weight="700">Transactional Switchover &amp; Health Guard</text>
  <text x="756" y="528" fill="#8b949e" font-size="11">Claims IP • Unlocks nftables • Rolls back on error</text>


  <!-- ==================== INTER-HOST DATA CHANNELS (CENTER x=478..722, gap=244) ==================== -->
  <!-- 1. Memory Stream -->
  <path d="M 478 432 L 720 432" fill="none" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="500" y="394" width="200" height="48" rx="6" fill="#0d1117" stroke="#2ea043" stroke-width="1.5"/>
  <text x="600" y="413" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">1. RAM Pages Stream (TLS)</text>
  <text x="600" y="431" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">TCP :27000 / :27001 (uffd)</text>

  <!-- 2. Metadata & FS Delta Stream -->
  <path d="M 478 326 L 720 326" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <rect x="500" y="288" width="200" height="48" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="600" y="307" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">2. Metadata &amp; FS Sync</text>
  <text x="600" y="325" fill="#8b949e" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Shared NFS/Ceph or rsync</text>


  <!-- ==================== BOTTOM NETWORK / IP MOBILITY FABRIC (x=180..1020, width=840) ==================== -->
  <rect x="180" y="590" width="840" height="66" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <rect x="180" y="590" width="840" height="24" rx="10" fill="url(#netGrad)"/>
  <text x="600" y="606" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">NETWORK &amp; IP MOBILITY LAYER (PRESERVES ESTABLISHED TCP CONNECTIONS)</text>
  <text x="600" y="631" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Workload IP (e.g. 10.0.0.99/24) moves seamlessly from Source A to Destination B</text>
  <text x="600" y="648" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">L2: Gratuitous ARP (arping -U)   •   L3: BGP /32 Route (gobgp)   •   Cloud: VPC Secondary IP API</text>

  <!-- Connectors to Network Layer -->
  <path d="M 250 564 L 300 590" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="220" y="582" fill="#a371f7" font-size="11" font-weight="600" text-anchor="end">1. Release IP</text>

  <path d="M 950 564 L 900 590" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="980" y="582" fill="#a371f7" font-size="11" font-weight="600">2. Claim IP + GARP/BGP</text>
</svg>
