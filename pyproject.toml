[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lkmp"
version = "0.1.0"
description = "Linux Kernel/Process Migration Orchestrator built on top of CRIU"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "LKMP Contributors"}
]
dependencies = []

[project.scripts]
lkmp = "lkmp.cli:main"
